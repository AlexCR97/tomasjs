name: Publish @tomasjs/cli

on:
  push:
    branches:
      - release/v2
    paths:
      - .github/workflows/packages-cli-cicd.yml
      - packages/cli/src/**
      - packages/cli/package.json

jobs:
  cicd:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org/
          token: ${{secrets.NPM_ACCESS_TOKEN}}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Install modules
        run: |
          cd ./packages/cli
          pnpm install

      - name: Build
        run: |
          cd ./packages/cli
          pnpm build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_ACCESS_TOKEN}}
        run: |
          cd ./packages/cli
          npm run publish
